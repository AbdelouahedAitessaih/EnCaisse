name: encaisse
description: "Encaisse — shared group cash management. Encaisse, ensemble."
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  flutter_riverpod: ^3.3.2
  go_router: ^17.4.0
  intl: 0.20.2
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.0
  google_mobile_ads: ^9.0.0
  lottie: ^3.3.3
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.5.0
  in_app_review: ^2.0.12
  share_plus: ^13.3.0
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  firebase_storage: ^13.4.6
  package_info_plus: ^10.2.1
  in_app_update: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/illustrations/
    - assets/branding/
