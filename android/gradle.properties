org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# Pin JDK for Gradle (your installed path). Override if you move Java.
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.12
# Required on Windows when the project (C:) and PUB_CACHE (D:) are on different drives.
# Avoids: "this and base files have different roots"
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
